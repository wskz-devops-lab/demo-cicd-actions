# ==============================================================================
# DEPLOY DO CLOUDFLARE WORKERS — Forgejo Actions (Self-Hosted Runner)
# ==============================================================================
# Ta sama automatyzacja wdrożenia na Cloudflare Workers, ale uruchamiana
# na Twoim własnym runnerze w Proxmoxie ('runs-on: linux-amd64').
#
# Ponieważ nasz runner korzysta z obrazu 'node:22-bookworm', Node.js i npm
# są już zainstalowane od razu — wdrożenie trwa zaledwie kilka sekund!
#
# WYMAGANE SEKRETY w Forgejo (Ustawienia repo -> Actions -> Sekrety):
#   1. CLOUDFLARE_API_TOKEN
#   2. CLOUDFLARE_ACCOUNT_ID
# ==============================================================================

name: Deploy Cloudflare Worker (Forgejo)

on:
  push:
    branches: [ main ]
    paths:
      - 'cloudflare-worker-demo/**'
      - '.forgejo/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    runs-on: linux-amd64
    defaults:
      run:
        working-directory: cloudflare-worker-demo

    steps:
      - name: 📥 Pobranie kodu
        uses: actions/checkout@v4

      - name: 🔧 Instalacja Wrangler CLI
        run: npm install

      # W Forgejo nie musimy nawet używać zewnętrznej akcji — wystarczy wywołać
      # oficjalne CLI 'npx wrangler deploy', przekazując oba sekrety jako
      # zmienne środowiskowe (Wrangler czyta je automatycznie!).
      - name: ☁️ Publikacja na Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
